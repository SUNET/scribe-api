[project]
name = "scribe-api"
version = "0.1.0"
description = "Python client for the Sunet Scribe API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
