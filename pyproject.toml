[project]
name = "scribe-api"
version = "1.0.0"
description = "Python client for the Sunet Scribe API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

authors = [{ name = "Kristofer Hallin", email = "kristofer@sunet.se" }]
maintainers = [{ name = "Kristofer Hallin", email = "kristofer@sunet.se" }]
keywords = ["scribe", "sunet", "transcription", "speech-to-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SUNET/scribe-api"
Repository = "https://github.com/SUNET/scribe-api"
Issues = "https://github.com/SUNET/scribe-api/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
